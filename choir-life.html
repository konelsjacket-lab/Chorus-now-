<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chorus Now</title>
<style>
:root {
  --bg: #EDF4F8;
  --bg-card: #FFFFFF;
  --bg-warm: #FDF6EE;
  --text: #2A3540;
  --text-dim: #7A8B96;
  --blue: #3B82B8;
  --blue-light: #D4E8F5;
  --blue-deep: #1E5A8A;
  --terracotta: #C67A4A;
  --terra-light: #F8EDE4;
  --lemon: #E8C840;
  --lemon-light: #FDF8E0;
  --sea: #2A9D8F;
  --sea-light: #DFF2EF;
  --warn: #C4553A;
  --warn-light: #FCEAE6;
  --good: #2A9D8F;
  --good-light: #DFF2EF;
  --border: #C8D8E4;
  --shadow: rgba(30,90,138,0.08);
  --font: 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --font-ui: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A24;
    --bg-card: #182530;
    --bg-warm: #1E2A2A;
    --text: #D4E0E8;
    --text-dim: #7A8B96;
    --blue: #5BA0D4;
    --blue-light: #1E3448;
    --blue-deep: #8AC4E8;
    --terracotta: #D4956A;
    --terra-light: #2A2018;
    --lemon: #D4B83A;
    --lemon-light: #2A2810;
    --sea: #4ABFB0;
    --sea-light: #152A28;
    --warn: #E07A5F;
    --warn-light: #3A2420;
    --good: #4ABFB0;
    --good-light: #152A28;
    --border: #2A3A48;
    --shadow: rgba(0,0,0,0.25);
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A24; --bg-card: #182530; --bg-warm: #1E2A2A;
  --text: #D4E0E8; --text-dim: #7A8B96; --blue: #5BA0D4;
  --blue-light: #1E3448; --blue-deep: #8AC4E8; --terracotta: #D4956A;
  --terra-light: #2A2018; --lemon: #D4B83A; --lemon-light: #2A2810;
  --sea: #4ABFB0; --sea-light: #152A28; --warn: #E07A5F;
  --warn-light: #3A2420; --good: #4ABFB0; --good-light: #152A28;
  --border: #2A3A48; --shadow: rgba(0,0,0,0.25);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 16px; line-height: 1.75;
  display: flex; flex-direction: column; min-height: 100%;
}
#game-container {
  max-width: 640px; width: 100%; margin: 0 auto;
  padding: 16px; flex: 1; display: flex; flex-direction: column;
}

/* === Decorative SVG collage === */
.deco { position: absolute; pointer-events: none; opacity: 0.18; }

/* === Status bar === */
.status-bar {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  margin-bottom: 10px; font-family: var(--font-ui); font-size: 12px;
}
.date-display {
  grid-column: 1 / -1; text-align: center; font-size: 14px;
  color: var(--blue-deep); padding: 6px 0; font-weight: 600;
  border-bottom: 2px solid var(--blue-light); margin-bottom: 4px;
  letter-spacing: 0.05em;
}
.stat-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 10px; background: var(--bg-card); border-radius: 8px;
  border: 1px solid var(--border); box-shadow: 0 1px 2px var(--shadow);
}
.stat-label { color: var(--text-dim); font-size: 12px; }
.stat-value { font-weight: 700; font-size: 13px; }
.stat-value.low { color: var(--warn); }
.stat-value.high { color: var(--sea); }

/* === Narrative === */
.narrative {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px 18px; margin-bottom: 10px;
  flex: 1; overflow-y: auto; box-shadow: 0 2px 8px var(--shadow);
  min-height: 220px; position: relative;
}
.narrative p { margin-bottom: 12px; text-indent: 2em; }
.narrative p:first-child { text-indent: 0; }
.narrative p.system-msg {
  text-indent: 0; color: var(--blue-deep); font-family: var(--font-ui);
  font-size: 14px; border-left: 3px solid var(--blue); padding-left: 12px;
  background: var(--blue-light); border-radius: 0 6px 6px 0; padding: 8px 12px;
  margin: 8px 0;
}
.narrative p.stat-change {
  text-indent: 0; font-family: var(--font-ui); font-size: 13px;
  padding: 5px 10px; border-radius: 6px; margin-top: 8px;
}
.narrative p.stat-up { background: var(--sea-light); color: var(--sea); }
.narrative p.stat-down { background: var(--warn-light); color: var(--warn); }

/* === Scene deco (inline SVG illustrations) === */
.scene-deco {
  text-align: center; margin: 8px 0 12px; opacity: 0.5;
}

/* === Choices === */
.choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.choice-btn {
  background: var(--bg-card); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 12px 16px; font-family: var(--font);
  font-size: 15px; color: var(--text); cursor: pointer; text-align: left;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  line-height: 1.5; box-shadow: 0 1px 3px var(--shadow);
}
.choice-btn:hover, .choice-btn:active {
  border-color: var(--blue); background: var(--blue-light);
  box-shadow: 0 2px 6px var(--shadow);
}
.choice-btn .choice-cost {
  display: block; font-family: var(--font-ui); font-size: 12px;
  color: var(--text-dim); margin-top: 2px;
}

/* === Title screen === */
.title-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; flex: 1; text-align: center; gap: 20px;
}
.title-screen h1 {
  font-size: 32px; font-weight: 700; color: var(--blue-deep);
  letter-spacing: 0.15em;
}
.title-deco { margin: 8px 0; }
.title-screen .subtitle {
  color: var(--text-dim); font-size: 15px; max-width: 340px; line-height: 1.9;
}
.start-btn {
  background: var(--blue); color: #fff; border: none; border-radius: 10px;
  padding: 12px 36px; font-family: var(--font-ui); font-size: 16px;
  cursor: pointer; box-shadow: 0 2px 8px rgba(59,130,184,0.3);
  transition: opacity 0.15s;
}
.start-btn:hover { opacity: 0.9; }

/* === Save/Load === */
.save-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); display: flex; align-items: center;
  justify-content: center; z-index: 999;
}
.save-panel {
  background: var(--bg-card); border-radius: 14px; padding: 24px;
  width: 90%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.save-panel h2 {
  font-size: 18px; color: var(--blue-deep); margin-bottom: 16px;
  text-align: center; font-family: var(--font-ui);
}
.save-slot {
  background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  font-family: var(--font-ui); font-size: 13px;
}
.save-slot:hover { border-color: var(--blue); background: var(--blue-light); }
.save-slot .slot-title { font-weight: 600; color: var(--text); margin-bottom: 4px; }
.save-slot .slot-info { color: var(--text-dim); font-size: 12px; }
.save-slot.empty { opacity: 0.5; font-style: italic; }
.save-actions {
  display: flex; gap: 8px; margin-top: 14px; justify-content: center;
}
.save-actions button {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 20px; font-family: var(--font-ui); font-size: 13px;
  cursor: pointer; color: var(--text);
}
.save-actions button:hover { background: var(--blue-light); }
.save-actions .btn-danger { color: var(--warn); }
.save-actions .btn-danger:hover { background: var(--warn-light); }
.save-menu-btn {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 10px; font-family: var(--font-ui); font-size: 12px;
  cursor: pointer; color: var(--text-dim);
  transition: background 0.15s, color 0.15s;
}
.save-menu-btn:hover { background: var(--blue-light); color: var(--blue-deep); }

/* === NPC panel === */
.npc-panel {
  background: var(--bg-warm); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 10px;
  font-family: var(--font-ui); font-size: 13px;
}
.npc-panel h3 {
  font-size: 13px; margin-bottom: 6px; color: var(--terracotta);
  font-weight: 600; letter-spacing: 0.05em;
}
.npc-entry {
  display: flex; justify-content: space-between; padding: 4px 0;
  border-bottom: 1px solid var(--border);
}
.npc-entry:last-child { border-bottom: none; }
.npc-name { font-weight: 600; }
.npc-detail { color: var(--text-dim); font-size: 12px; }
.npc-relation { color: var(--text-dim); font-size: 12px; }
.npc-flag { font-size: 15px; margin-right: 3px; }

.hidden { display: none !important; }
</style>
</head>
<body>
<div id="game-container">

<!-- Title Screen -->
<div id="title-screen" class="title-screen">
  <svg class="title-deco" width="120" height="40" viewBox="0 0 120 40">
    <circle cx="10" cy="30" r="6" fill="var(--lemon)" opacity="0.6"/>
    <circle cx="110" cy="25" r="8" fill="var(--terracotta)" opacity="0.4"/>
    <path d="M25 35 Q40 5 55 30 Q70 8 85 32 Q95 15 110 28" stroke="var(--blue)" fill="none" stroke-width="1.5" opacity="0.5"/>
    <text x="30" y="15" font-size="14" fill="var(--blue)" opacity="0.4">♪</text>
    <text x="65" y="12" font-size="12" fill="var(--sea)" opacity="0.4">♫</text>
    <text x="90" y="18" font-size="10" fill="var(--terracotta)" opacity="0.3">♩</text>
  </svg>
  <h1>Chorus Now</h1>
  <svg width="200" height="50" viewBox="0 0 200 50">
    <path d="M0 40 Q30 20 60 35 Q90 10 120 30 Q150 15 180 38 L200 35" stroke="var(--blue)" fill="none" stroke-width="1" opacity="0.3"/>
    <rect x="20" y="18" width="12" height="18" rx="2" fill="var(--terracotta)" opacity="0.15"/>
    <rect x="22" y="22" width="3" height="3" rx="0.5" fill="var(--blue)" opacity="0.3"/>
    <rect x="27" y="22" width="3" height="3" rx="0.5" fill="var(--blue)" opacity="0.3"/>
    <circle cx="100" cy="28" r="5" fill="var(--lemon)" opacity="0.2"/>
    <path d="M98 25 L100 20 L102 25" stroke="var(--sea)" fill="none" stroke-width="0.8" opacity="0.4"/>
    <text x="155" y="30" font-size="16" opacity="0.15">🍋</text>
    <text x="170" y="22" font-size="12" opacity="0.15">☀</text>
  </svg>
  <p class="subtitle">你刚搬到地中海边的一座小城。<br>阳光很好，但你谁也不认识。<br>社区公告板上有一张传单——<br>「城市之声」合唱团，欢迎任何人。</p>
  <button class="start-btn" onclick="startGame()">开始新生活</button>
  <button class="start-btn" style="background:var(--sea);margin-top:8px" onclick="openLoadPanel()">读取存档</button>
</div>

<!-- Game UI -->
<div id="game-ui" class="hidden">
  <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px">
    <button class="save-menu-btn" onclick="openSavePanel()">💾 存档</button>
    <button class="save-menu-btn" onclick="openLoadPanel()">📂 读档</button>
  </div>
  <div class="status-bar" id="status-bar"></div>
  <div class="narrative" id="narrative"></div>
  <div id="npc-panel-area"></div>
  <div class="choices" id="choices"></div>
</div>
</div>

<script>
// ========== GAME STATE ==========
const S = {
  day: 1, timeSlot: 0,
  vocal: 5, social: 10, energy: 80, mood: 50, money: 800, sightRead: 0,
  hasJob: false, jobType: null, jobPay: 0,
  choirJoined: false, metSofia: false, metSuChi: false, metNico: false,
  sofiaQuest: 0, hasDog: false, dogName: '', dogEncounters: 0,
  metStreetArtist: false, metTomás: false,
  artSkill: 0, paintingLessons: 0,
  calledParents: 0, lastParentCall: 0,
  composingPhase: 0, composingDay: 0, composingSongShared: false,
  shelterVisits: 0, museumVisits: 0, antiqueShopUnlocked: false, antiqueItems: [], rockBarUnlocked: false, rockBarGigs: 0, lastRockBarDay: 0,
  choirDrama: {}, npcRomances: { carlosMarta: 0 },
  ownedInstruments: [], lastInstrumentPractice: 0,
  giftsGiven: {}, vacationsTaken: 0, soloDatesDone: {},
  rehearsalCount: 0,
  choirPhase: 0,
  metAtRehearsal: {},
  sideStories: {},
  groupEvents: {},
  competitionAnnounced: false,
  repertoire: [],
  sectionalCount: 0,
  npcs: {}
};

const TIME_NAMES = ['早上', '下午', '傍晚', '深夜'];
const DAY_NAMES = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

// ========== NPC DATA ==========
const NPC_TEMPLATES = [
  // Core 4 + conductor
  { id: 'dietrich', name: 'Dietrich', flag: '🇩🇪', age: 45, part: '指挥',
    personality: '严谨、公正、偶尔冷幽默',
    desc: '大学合唱教师，八年前创办「城市之声」。穿万年不变的亚麻衬衫。门槛低，标准不低。' },
  { id: 'sofia', name: 'Sofia', flag: '🇵🇹', age: 22, part: '（邻居）',
    personality: 'ISFJ · 安静、细心、慢热',
    desc: '葡萄牙内陆小镇来的护理专业大学生。你的隔壁邻居，不在合唱团。会记得你随口说过的事。' },
  { id: 'suchi', name: '苏迟', flag: '🇨🇳', age: 25, part: '男中音',
    personality: 'INFJ · 敏感、表达力强、慢热',
    desc: '艺术世家出身，父亲是书法家，母亲教古筝。来这里念音乐学硕士，研究方向是合唱美学。音准和视谱能力是团里最好的，写的乐评细腻得像散文。排练来得准走得快，不是社恐，只是习惯独处。' },
  { id: 'nico', name: 'Nico', flag: '🇷🇴', age: 26, part: '女高音',
    personality: 'ENTP · 精力过剩、点子多、不太靠谱',
    desc: '罗马尼亚人，本来是旅游的但没走。做hostel前台和零活。合唱团气氛制造机。' },
  // Extended cast
  { id: 'marta', name: 'Marta', flag: '🇵🇱', age: 42, part: '女低音',
    personality: '热心、话多、合唱团活档案',
    desc: '波兰来的护士，在这座城市十五年了。知道所有人的故事，不管你想不想听。做的苹果蛋糕很好吃。' },
  { id: 'ibrahim', name: 'Ibrahim', flag: '🇸🇾', age: 30, part: '男高音',
    personality: '安静、认真、唱歌时判若两人',
    desc: '建筑系博士生，来了四年。平时话很少，但一开口唱歌就像换了个人，声音亮得吓人。' },
  { id: 'lena', name: 'Lena', flag: '🇩🇪', age: 28, part: '女高音',
    personality: '直、有点刺、但不是坏人',
    desc: '本地人，在市文化局做行政。学过声乐，对音准有洁癖。嘴毒但排练完会主动帮你指出问题。' },
  { id: 'yuki', name: 'Yuki', flag: '🇯🇵', age: 29, part: '伴奏',
    personality: '礼貌到有距离感、完美主义',
    desc: '交换来的钢琴教师，负责合唱团伴奏。总是第一个到排练室。弹琴时表情比说话时丰富一百倍。' },
  { id: 'carlos', name: 'Carlos', flag: '🇧🇷', age: 36, part: '男中音',
    personality: '外向、热情、合唱团的胃',
    desc: '巴西人，在海边开了一家小餐厅。排练完总请人吃东西。把合唱团当第二个家。' },
  { id: 'aoife', name: 'Aoife', flag: '🇮🇪', age: 24, part: '女中音',
    personality: '温和、有主见、同为新人',
    desc: '爱尔兰人，自由翻译，来了四个月。和你一样是城市新人，所以天然有种同盟感。' },
];

function initNPCs() {
  NPC_TEMPLATES.forEach(t => {
    S.npcs[t.id] = { ...t, affinity: 0, talked: 0, events: [] };
  });
}

// ========== SVG DECO SNIPPETS ==========
const DECO = {
  seagull: '<svg width="24" height="16" viewBox="0 0 24 16" style="vertical-align:middle;opacity:0.25"><path d="M2 10 Q6 2 12 8 Q18 2 22 10" stroke="var(--blue-deep)" fill="none" stroke-width="1.2"/></svg>',
  note: '<svg width="14" height="18" viewBox="0 0 14 18" style="vertical-align:middle;opacity:0.3"><ellipse cx="5" cy="14" rx="4" ry="3" fill="var(--blue)"/><line x1="9" y1="14" x2="9" y2="2" stroke="var(--blue)" stroke-width="1.2"/><path d="M9 2 Q14 4 9 7" fill="var(--blue)" opacity="0.6"/></svg>',
  lemon: '<svg width="18" height="18" viewBox="0 0 18 18" style="vertical-align:middle;opacity:0.2"><ellipse cx="9" cy="10" rx="7" ry="6" fill="var(--lemon)"/><path d="M5 6 Q9 2 13 6" stroke="var(--sea)" fill="none" stroke-width="0.8"/></svg>',
  coffee: '<svg width="16" height="18" viewBox="0 0 16 18" style="vertical-align:middle;opacity:0.2"><rect x="2" y="6" width="10" height="10" rx="2" fill="var(--terracotta)"/><path d="M12 9 Q15 10 12 13" stroke="var(--terracotta)" fill="none" stroke-width="1"/><path d="M4 5 Q5 2 6 5" stroke="var(--text-dim)" fill="none" stroke-width="0.6" opacity="0.4"/><path d="M7 4 Q8 1 9 4" stroke="var(--text-dim)" fill="none" stroke-width="0.6" opacity="0.4"/></svg>',
  train: '<svg width="28" height="16" viewBox="0 0 28 16" style="vertical-align:middle;opacity:0.2"><rect x="2" y="2" width="20" height="10" rx="3" fill="var(--blue)"/><rect x="4" y="4" width="5" height="4" rx="1" fill="var(--bg-card)" opacity="0.6"/><rect x="11" y="4" width="5" height="4" rx="1" fill="var(--bg-card)" opacity="0.6"/><circle cx="7" cy="14" r="2" fill="var(--blue-deep)"/><circle cx="17" cy="14" r="2" fill="var(--blue-deep)"/></svg>',
  flower: '<svg width="16" height="16" viewBox="0 0 16 16" style="vertical-align:middle;opacity:0.2"><circle cx="8" cy="6" r="2" fill="var(--terracotta)"/><circle cx="5" cy="8" r="2" fill="var(--terracotta)" opacity="0.6"/><circle cx="11" cy="8" r="2" fill="var(--terracotta)" opacity="0.6"/><circle cx="8" cy="10" r="2" fill="var(--terracotta)" opacity="0.4"/><circle cx="8" cy="8" r="1.5" fill="var(--lemon)"/><line x1="8" y1="10" x2="8" y2="16" stroke="var(--sea)" stroke-width="1"/></svg>',
};
function deco(name) { return DECO[name] || ''; }
function sceneDeco(...names) {
  return '<div class="scene-deco">' + names.map(n => deco(n)).join(' ') + '</div>';
}

// ========== RENDERING ==========
function renderStatus() {
  const dow = (S.day - 1) % 7;
  const weekNum = Math.ceil(S.day / 7);
  document.getElementById('status-bar').innerHTML = `
    <div class="date-display">${deco('seagull')} 第${weekNum}周 · ${DAY_NAMES[dow]} · ${TIME_NAMES[S.timeSlot]} ${deco('note')}</div>
    <div class="stat-item"><span class="stat-label">🎵 声乐</span><span class="stat-value ${S.vocal<15?'low':S.vocal>40?'high':''}">${S.vocal}</span></div>
    <div class="stat-item"><span class="stat-label">👥 社交</span><span class="stat-value ${S.social<15?'low':S.social>40?'high':''}">${S.social}</span></div>
    <div class="stat-item"><span class="stat-label">⚡ 体力</span><span class="stat-value ${S.energy<25?'low':S.energy>70?'high':''}">${S.energy}</span></div>
    <div class="stat-item"><span class="stat-label">💙 心情</span><span class="stat-value ${S.mood<25?'low':S.mood>70?'high':''}">${S.mood}</span></div>
    <div class="stat-item"><span class="stat-label">💶 存款</span><span class="stat-value ${S.money<200?'low':''}">${S.money}€</span></div>
    <div class="stat-item"><span class="stat-label">📖 视谱</span><span class="stat-value ${S.sightRead>30?'high':''}">${S.sightRead}</span></div>
    ${S.artSkill > 0 ? `<div class="stat-item"><span class="stat-label">🎨 绘画</span><span class="stat-value ${S.artSkill>15?'high':''}">${S.artSkill}</span></div>` : ''}
    ${S.choirPhase >= 2 ? `<div class="stat-item" style="grid-column:1/-1;text-align:center;background:var(--terra-light);color:var(--terracotta)"><span class="stat-label">🏛 Europa Cantat</span><span class="stat-value">${S.choirPhase>=3?'备战中':S.choirPhase>=2?'已接受邀请':''}</span></div>` : ''}`;
}

function showNarrative(paragraphs) {
  const el = document.getElementById('narrative');
  el.innerHTML = paragraphs.map(p => {
    if (p.type === 'system') return `<p class="system-msg">${p.text}</p>`;
    if (p.type === 'stat-up') return `<p class="stat-change stat-up">${p.text}</p>`;
    if (p.type === 'stat-down') return `<p class="stat-change stat-down">${p.text}</p>`;
    if (p.type === 'deco') return sceneDeco(...p.items);
    return `<p>${p.text}</p>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function showChoices(choices) {
  const el = document.getElementById('choices');
  el.innerHTML = choices.map((c, i) => `
    <button class="choice-btn" onclick="handleChoice(${i})">
      ${c.text}
      ${c.cost ? `<span class="choice-cost">${c.cost}</span>` : ''}
    </button>`).join('');
  window._currentChoices = choices;
}

function showNPCPanel() {
  const area = document.getElementById('npc-panel-area');
  const known = Object.values(S.npcs).filter(n => n.talked > 0);
  if (!known.length) { area.innerHTML = ''; return; }
  area.innerHTML = `<div class="npc-panel">
    <h3>${deco('flower')} 认识的人</h3>
    ${known.map(n => `<div class="npc-entry">
      <span><span class="npc-flag">${n.flag}</span><span class="npc-name">${n.name}</span>${n.romance?' 💙':''}</span>
      <span class="npc-detail">${n.part} · ${affinityLabel(n.affinity)}${n.affinity>0?' ('+n.affinity+')':''}</span>
    </div>`).join('')}
  </div>`;
}

function affinityLabel(v) {
  if (v < -10) return '关系紧张';
  if (v < 5) return '点头之交';
  if (v < 15) return '有些面熟';
  if (v < 30) return '聊得来';
  if (v < 50) return '朋友';
  return '挚友';
}
function clamp(v, lo=0, hi=100) { return Math.max(lo, Math.min(hi, v)); }
function adjustStat(stat, delta) {
  if (stat === 'money') { S.money += delta; return; }
  S[stat] = clamp(S[stat] + delta);
}
function advanceTime() {
  S.timeSlot++;
  if (S.timeSlot > 3) {
    S.timeSlot = 0; S.day++;
    S.energy = clamp(S.energy + 30);
    if (S.day % 30 === 0) S.money -= 420;
  }
}
function dayOfWeek() { return (S.day - 1) % 7; }
function isRehearsalTime() { return (dayOfWeek() === 2 || dayOfWeek() === 6) && S.timeSlot === 2; }
function isExtraRehearsalTime() { return S.rehearsalCount >= 3 && (dayOfWeek() === 5 && S.timeSlot === 0 || dayOfWeek() === 0 && S.timeSlot === 1); }
function isSectionalTime() { return S.choirPhase >= 3 && (dayOfWeek() === 1 || dayOfWeek() === 3) && S.timeSlot === 2; }
function isWeekend() { return dayOfWeek() >= 5; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function handleChoice(idx) {
  const c = window._currentChoices[idx];
  if (c.action) c.action();
}

    { id: 'ao2', affinity: 20, label: '和Aoife去二手市场', time: [1],

    { id: 'ao3', affinity: 35, label: 'Aoife夜里找你', time: [3],

    { id: 'le3', affinity: 38, label: 'Lena请你去她家听唱片', time: [2],

function npcEvent(npcId, eventId, texts, stats, romantic, romanceChoice) {
  const npc = S.npcs[npcId];
  npc.talked++; npc.events.push(eventId);
  npc.affinity += 5;
  adjustStat('energy', -5); advanceTime();
  Object.entries(stats||{}).forEach(([k,v]) => adjustStat(k,v));
  renderStatus();
  
  const paras = texts.map(t => ({text: t}));
  const statTexts = Object.entries(stats||{}).map(([k,v]) => {
    const names = {social:'社交',mood:'心情',vocal:'声乐',money:'€',energy:'体力'};
    return `${names[k]||k} +${v}`;
  }).join(' · ');
  if (statTexts) paras.push({ type: 'stat-up', text: statTexts + ` · ${npc.name} 好感度提升` });
  else paras.push({ type: 'stat-up', text: `${npc.name} 好感度提升` });
  
  showNarrative(paras);
  
  if (romanceChoice) {
    showChoices([
      { text: '（心里有什么东西在动）', cost: '进入暧昧', action: () => { npc.romance = true; npc.affinity += 10; sceneDailyMenu(); } },
      { text: '（当作普通朋友）', action: sceneDailyMenu },
    ]);
  } else {
    showChoices([{ text: '继续', action: sceneDailyMenu }]);
  }
}

// Get available NPC events for current time slot
function getAvailableNPCVisits() {
  const time = S.timeSlot;
  const visits = [];
  for (const [npcId, events] of Object.entries(NPC_EVENTS)) {
    const npc = S.npcs[npcId];
    if (npcId === 'tomas' && !npc && S.npcs.carlos && S.npcs.carlos.talked > 0) {
      visits.push({ text: '去Carlos的店坐坐', cost: '体力-5', action: sceneCarlosNewNPC });
      continue;
    }
    if (!npc || npc.talked < 1) continue; // must have met them
    for (const ev of events) {
      if (npc.events.includes(ev.id)) continue; // already done
      if (npc.affinity < ev.affinity) continue; // not enough affinity
      if (!ev.time.includes(time)) continue; // wrong time of day
      visits.push({ text: ev.label, cost: `体力-5 · ${npc.name}`, action: ev.scene });
      break; // only show the next available event per NPC
    }
  }
  return visits;
}

function getAvailableSideStories() {
  const time = S.timeSlot;
  const stories = [];
  for (const [npcId, ss] of Object.entries(SIDE_STORIES)) {
    if (S.sideStories[npcId]) continue;
    const npc = S.npcs[npcId];
    if (!npc || npc.talked < 1) continue;
    if (npc.affinity < ss.threshold) continue;
    if (!ss.time.includes(time)) continue;
    stories.push({ text: ss.label, cost: `${npc.name}支线`, action: ss.opener });
  }
  return stories;
}

function getAvailableGroupEvents() {
  if (!S.groupEvents) S.groupEvents = {};
  const time = S.timeSlot;
  const events = [];
  for (const ge of GROUP_EVENTS) {
    if (S.groupEvents[ge.id]) continue;
    if (!ge.time.includes(time)) continue;
    const allMet = ge.requires.every(id => S.npcs[id] && S.npcs[id].talked > 0 && S.npcs[id].affinity >= ge.minAffinity);
    if (!allMet) continue;
    events.push({ text: ge.label, cost: '多人友情', action: ge.scene });
  }
  return events;
}

        { text: '「这栋楼的热水有时候会断，」她说，「还有，周二早上楼下那家会烤面包，很香但是六点就开始，可能会被吵醒。」你说："被面包香味吵醒听起来还不错。"她想了想说："你说得对，其实我每次也是被香醒的。"' },

  } else if (time === 1) {

  } else if (time === 2) {
    paras.push({ text: pick(['天色开始变了。海面从蓝变成橘红。', '傍晚的风从海上吹过来，带着凉意。街上的人多了起来。', '远处的山变成了紫色的剪影。路灯一盏一盏亮起来。']) });
  } else {
    paras.push({ text: pick(['夜深了。远处的海是黑的，只有灯塔的光一闪一闪。', '很安静。隔壁Sofia的灯已经灭了。', '窗外有人在某处弹吉他，很远，断断续续。']) });
  }

  showNarrative(paras);
  const choices = [];

  if (time === 3) {
    choices.push({ text: '睡觉', cost: '结束这一天', action: () => { advanceTime(); sceneDailyMenu(); } });
    if (S.mood < 40) choices.push({ text: '失眠了，翻来覆去', cost: '心情-5', action: () => {
      adjustStat('mood', -5); S.energy = clamp(S.energy-15); advanceTime(); sceneDailyMenu();
    }});
  } else {
    if (isRehearsalTime() && S.choirJoined)
      choices.unshift({ text: '🎵 坐火车去合唱团排练', cost: '体力-15', action: sceneTrainToRehearsal });
    if (isExtraRehearsalTime() && S.choirJoined)
      choices.unshift({ text: '🎵 加排练习（自愿）', cost: '体力-15', action: sceneTrainToRehearsal });
    if (isSectionalTime() && S.choirJoined)
      choices.unshift({ text: '🎵 声部分排练', cost: '体力-12', action: sceneSectional });

    if (S.hasJob && time < 2 && dayOfWeek() < 5)
      choices.unshift({ text: `去上班（${S.jobType}）`, cost: '体力-20，+钱', action: sceneWork });

    if (time < 2 && !S.hasJob)
      choices.push({ text: '找工作', cost: '体力-15', action: sceneFindJob });

    choices.push({ text: '出门走走', cost: '体力-5，心情+5', action: sceneWalkMenu });
    if (S.hasDog)
      choices.push({ text: `🐕 带${S.dogName}去散步`, cost: '体力-5，心情+8', action: () => {
        adjustStat('energy',-5); adjustStat('mood',8); adjustStat('social',2); advanceTime(); renderStatus();
        const dogWalks = [
          `${S.dogName}在沙滩上追海浪，每次浪退的时候它就冲上去，浪来的时候它就疯跑回来。你笑到肚子疼。`,
          `你带${S.dogName}去了广场。面包房老板娘出来摸了摸它的头，送了你一块杏仁饼。${S.dogName}吃了半块。`,
          `${S.dogName}在公园里交了一个朋友——一只巨大的金毛。它们绕着喷泉跑了二十分钟。金毛的主人是个笑眯眯的老爷爷，给你讲了十分钟本地的狗公园在哪。`,
          `你和${S.dogName}沿着铁轨边走。火车经过的时候它汪了一声。你觉得它在跟火车打招呼。`,
          `带${S.dogName}路过Carlos的餐厅，Carlos出来说"这位新成员要不要也来一份？"然后认真地给它倒了碗水。`,
        ];
        // Su Chi dog encounter (rare bonus)
        if (S.metSuChi && Math.random() < 0.25) {
          showNarrative([
            { text: pick(dogWalks) },
            { text: `你在回家的路上碰到了苏迟。他看到${S.dogName}的时候表情出现了一种你从没见过的变化——他蹲下来了。` },
            { text: `${S.dogName}冲过去舔他的手。苏迟的嘴角弯了一下。他摸了它的耳朵，很轻很轻地说："你好。"` },
            { text: '你觉得你突然理解了苏迟。他不是冷漠，他只是用一种更安静的方式在靠近这个世界——像他的音乐分析一样，细密而不张扬。' },
            { type: 'stat-up', text: `心情 +8 · 社交 +2 · 苏迟好感度 +5` },
          ]);
          S.npcs.suchi.affinity += 5;
        } else {
          showNarrative([{ text: pick(dogWalks) }, { type: 'stat-up', text: `心情 +8 · 社交 +2` }]);
        }
        showChoices([{ text: '继续', action: sceneDailyMenu }]);
      }});
    choices.push({ text: '在家练唱歌', cost: '体力-10，声乐+2', action: scenePractice });
    if (S.composingPhase >= 1 && S.composingPhase < 5)
      choices.push({ text: '✍ 继续创作', cost: '体力-10，心情+5', action: sceneCompose });
    if (S.composingPhase === 5 && !S.composingSongShared)
      choices.push({ text: '✍ 关于你写的那首歌…', action: sceneComposeShare });

    // Phone calls & friends
    if (time <= 2 && (S.day - S.lastParentCall >= 3 || !S.calledParents))
      choices.push({ text: '📱 给家里打电话', cost: '心情+8', action: sceneCallParents });

    // Painting with Tomás
    if (S.metTomás && S.npcs.tomas && time >= 1 && time <= 2)
      choices.push({ text: '🎨 找Tomás学画画', cost: '体力-10，心情+8', action: scenePaintingLesson });

    // Instrument practice at home
    if (S.ownedInstruments.length > 0 && time <= 2)
      choices.push({ text: '🎸 练习乐器', cost: '体力-10，声乐+3，视谱+2', action: sceneInstrumentPractice });

    // Shopping options (appear when money >= 200)
    if (S.money >= 80 && time >= 1 && time <= 2)
      choices.push({ text: '🛍 去逛街', cost: '花钱', action: sceneShoppingMenu });

    // Group vacation (money >= 300, average affinity >= 30)
    if (S.money >= 300 && isWeekend() && time === 0) {
      const metNpcs = Object.values(S.npcs).filter(n => n.talked > 0);
      const avgAff = metNpcs.length > 0 ? metNpcs.reduce((s,n) => s + n.affinity, 0) / metNpcs.length : 0;
      if (metNpcs.length >= 3 && avgAff >= 30)
        choices.push({ text: '🏖 约朋友们去度假！', cost: '300-500€', action: sceneVacationMenu });
    }

    // Solo date (high affinity NPC)
    if (time >= 1 && time <= 2 && isWeekend()) {
      const dateNPCs = Object.values(S.npcs).filter(n => n.affinity >= 30 && n.talked >= 3 && !S.soloDatesDone[n.id + '_' + Math.floor(S.day/14)]);
      if (dateNPCs.length > 0 && S.money >= 50)
        choices.push({ text: '💌 约人单独出去', cost: '50-80€', action: sceneSoloDateMenu });
    }

    // Dynamic NPC visits
    const npcVisits = getAvailableNPCVisits();
    npcVisits.forEach(v => choices.push(v));

    // Side stories
    const sideStoryOptions = getAvailableSideStories();
    sideStoryOptions.forEach(v => choices.push(v));

    // Group friendship events
    const groupOptions = getAvailableGroupEvents();
    groupOptions.forEach(v => choices.push(v));

    if (!S.choirJoined)
      choices.push({ text: '去广场看看公告板', action: () => {
        S.choirJoined = true; advanceTime();
        showNarrative([{ text: '你又看到了那张海蓝色传单。城市之声合唱团，每周三傍晚。坐蓝线火车去大学站。' }, { type: 'system', text: '你记下了排练时间。' }]);
        showChoices([{ text: '继续', action: sceneDailyMenu }]);
      }});

    choices.push({ text: '休息一下', cost: '体力+20', action: () => { adjustStat('energy',20); advanceTime(); sceneDailyMenu(); } });

    if (time === 2)
      choices.push({ text: '做饭吃', cost: '-12€，心情+8', action: () => {
        adjustStat('money',-12); adjustStat('mood',8); adjustStat('energy',-5); advanceTime(); renderStatus();
        showNarrative([
          { text: pick([
            '你在杂货店买了番茄、罗勒和一块新鲜的马苏里拉。做了一个很简单的caprese和一碗意面。坐在阳台上吃的时候觉得番茄比国内的甜。',
            '你试着做了一道番茄煮鱼。味道不太对，但热的，是你自己做的。隔壁飘来Sofia做饭的香味，似乎比你做得好。',
            '你买了本地的面包和一罐橄榄，配着奶酪吃了。简单但够了。阳台上那盆天竺葵歪歪地看着你吃完。',
          ])},
          { type: 'stat-up', text: '心情 +8' },

        showChoices([{ text: '继续', action: sceneDailyMenu }]);
      }});
  }
  showChoices(choices);
}

    const ch = [
      { text: '认真跟着排练', cost: '声乐+3', action: () => sceneRehearsalFocus() },
      { text: '排练间隙和人聊聊', cost: '社交+3', action: () => sceneRehearsalChat() },

// --- Walk (destination choice) ---
function sceneWalkMenu() {
  adjustStat('energy', -5); adjustStat('mood', 5); advanceTime(); renderStatus();

  const r = Math.random();
  if (r < 0.10 && S.metSuChi) return sceneSuChiBump();
  if (r < 0.18 && !S.hasDog && S.day > 5 && !S.dogEncounters) { S.dogEncounters = 1; return sceneStrayDog1(); }
  if (r < 0.18 && !S.hasDog && S.dogEncounters === 1 && S.day > 10) return sceneStrayDog2();
  if (r < 0.24 && !S.metStreetArtist && S.day > 4) { S.metStreetArtist = true; return sceneStreetArtist(); }

  const allDests = [
    { text: '🌊 去海边', action: sceneWalkSeaside },
    { text: '🏛 去美术馆', action: sceneWalkMuseum },
    { text: '🏐 去排球场', action: sceneWalkVolleyball },
    { text: '📚 去图书馆', action: sceneWalkLibrary },
    { text: '🏘 逛旧城区', action: sceneWalkOldTown },
    { text: '🛒 逛集市', action: sceneWalkMarket },
    { text: '⛰ 去山上观景台', action: sceneWalkViewpoint },
  ];
  if (S.day > 3) allDests.push({ text: '🐕 去流浪狗收容基地', action: sceneWalkShelter });
  if (S.antiqueShopUnlocked) allDests.push({ text: '🔮 去古董店', action: sceneWalkAntique });
  if (S.rockBarUnlocked && S.day - S.lastRockBarDay >= 5 && Math.random() < 0.35) allDests.push({ text: '🎸 去摇滚酒吧驻唱', action: sceneWalkRockBar });

  const dests = [];
  const pool = [...allDests];
  const count = 3 + (Math.random() < 0.5 ? 1 : 0);
  while (dests.length < count && pool.length > 0) {
    const i = Math.floor(Math.random() * pool.length);
    dests.push(pool.splice(i, 1)[0]);
  }
  dests.push({ text: '随便走走', action: sceneWalkRandom });

  showNarrative([{ text: '你决定出门走走。去哪呢？' }]);
  showChoices(dests);
}

function walkEnd(extra) {
  const parts = [{ type: 'stat-up', text: '心情 +5' + (extra || '') }];
  showChoices([{ text: '继续', action: sceneDailyMenu }]);
  return parts;
}

    showNarrative([{ text: '你在乐器店里转了一圈。老板认出了你："又来啦？你已经把我店里适合你的都买走了。"你说："那你进点新货啊。"他笑了。' }]);
    showChoices([{ text: '回去', action: sceneShoppingMenu }]);
    return;
  }
  const paras = [
    { text: '乐器店很小，但塞满了东西。墙上挂着吉他、曼陀林、一把不知道什么年代的班卓琴。柜台后面坐着一个络腮胡子的老头，在调一把小提琴的弦。他抬头看了你一眼："看看？"' },
  ];
  showNarrative(paras);
  const choices = available.map(inst => ({
    text: `${inst.name}（${inst.price}€）`,

function sceneNicoRockBar1() {
  const npc = S.npcs.nico;
  npc.talked++; npc.events.push('nc5'); npc.affinity += 8;
  adjustStat('energy', -5); advanceTime(); renderStatus();

  showNarrative([
    { text: 'Nico约你去港口那边散步。你们走到一条你没去过的老街上——酒吧、纹身店、一家永远在放雷鬼乐的理发店。Nico的步子慢了下来，不像平时那样飞快。' },
    { text: '她在一扇黑色铁门前停了下来。门上用白色油漆潦草地写着「INFERNO」。没有招牌灯，没有营业时间。' },
    { text: '你说："这是什么地方？"她没有马上回答。她伸手碰了一下门——那个动作太轻了，不像是要推开，更像是在确认它还在。' },
    { text: '「我有件事想跟你说。」她的声音不太一样。没有感叹号，没有表情包式的语气。「但你得答应我不告诉合唱团的人。」' },
    { text: '你说好。' },
    { text: '「我在这里唱歌。」她说。「每周四晚上。驻唱。摇滚。」' },
    { text: '你张嘴想说"啊"但没发出声音。Nico——那个在合唱团唱女高音的、精力过剩的、每次排练完第一个喊肚子饿的Nico——摇滚驻唱？' },
    { text: '她看出了你的表情：「你看，这就是我不跟人说的原因。」她笑了一下，但那个笑里有一点防御。「大家觉得我是小太阳嘛。阳光可爱什么都不怕。但有时候我不想可爱。我想嘶吼。我想把胸腔里堆了一周的东西全吼出来。你懂吗？」' },
    { text: '你说："我懂。"你确实懂。你也有想尖叫的时候。只是你从来不敢。' },
    { text: '她盯着那扇铁门看了一会儿。「Dietrich知道。他没说什么——他只说了一句『好的歌手在任何风格里都是好的歌手』。除了他和老板没人知道。」' },
    { text: '她转过头来看你，眼神跟天台那次很像——认真的、不设防的：「下周四你来不来？我——我想让你看到。另一个我。」' },
    { text: '你说："来。"你没有犹豫。' },
    { text: '她笑了——这次是真的笑了。「得变装。」她说，语气忽然又变回那个Nico。「你不能穿成合唱团团建的样子出现在摇滚酒吧里。我不认识你。」' },
    { type: 'system', text: 'Nico告诉了你她的秘密。下周四，酒吧见。' },
    { type: 'stat-up', text: '心情 +8 · Nico好感度提升' },
  ]);
  adjustStat('mood', 8);
  showChoices([{ text: '继续', action: sceneDailyMenu }]);
}

function sceneNicoRockBar2b() {
  showNarrative([
    { text: '你到INFERNO门口的时候差点没认出Nico。' },
    { text: '她穿着一件剪掉了袖子的乐队T恤——上面印着一个你不认识的罗马尼亚朋克乐队。破洞网袜，厚底靴，眼线画到太阳穴，嘴唇涂成暗红色。头发用发蜡弄得一缕一缕的，像火焰。她脖子上挂着三条银色项链。' },

    { text: '推开铁门。里面比外面暗，空气是啤酒和烟雾和旧木头的混合气味。墙上贴满了乐队海报，灯光是红色的，地面微微振动——你能通过脚底感觉到bass。大概四五十个人，有的站在吧台边，有的坐在角落里。年龄从二十到六十都有。没人看起来像合唱团成员。' },
    { text: '一个满脸胡子的男人从吧台后面伸出手来："Nico！你的人来了！"Nico击了他一掌："Marco，这是我朋友。今晚她跟我一起。"' },
    { text: '你说："等——一起？"' },

    { text: '你想说你没准备好。你想说你连摇滚都不怎么听。你想说你的嗓子是练出来唱《Ave Verum Corpus》的不是嘶吼的。但Nico已经拉着你的手往舞台走了——所谓舞台就是一个比地面高出二十厘米的木台，上面一个麦克风架，一把电吉他，一面很破的鼓。' },
    { text: '她拿起那把电吉他挂在身上——你之前不知道她会弹吉他——试了几个和弦。声音很脏、很重、很好听。你站在旁边，膝盖有点软。' },
  ]);

function sceneNicoRockBar2c() {
  showNarrative([
    { text: '「第一首我自己来。」Nico说。然后她对着麦克风吹了一下。' },
    { text: '全场安静了三秒——一种习惯性的安静，像他们知道接下来会发生什么。' },
    { text: '然后Nico开始唱了。' },
    { text: '你不知道这首歌叫什么。歌词是罗马尼亚语的，你一个字也听不懂。但你听到了——' },
    { text: '那不是女高音。那不是合唱团的Nico。那是另一个声音——从嗓子最深的地方刮出来的，像砂纸蹭过铁丝，像火从裂缝里窜出来。她的身体在动，不是排练时的站姿，是一种本能的、不受控制的动。她闭着眼睛，握着麦克风的手指发白。' },
    { text: '你站在台侧看着她。你想起她在天台上说的话——「我怕安静下来就得想很多事情」。你忽然明白了。这就是她的出口。合唱团给她归属感，但这里——这里给她释放。这里她不需要做任何人的小太阳。' },
    { text: '唱完第一首的时候台下口哨声和掌声乱作一团。Nico喘着气，额头上全是汗。她回头看你——笑了。那个笑里有一种你在合唱团从没见过的东西：野。' },

    { text: '你拿着麦克风。手在抖。台下四五十个陌生人在看你。他们不认识你。他们不知道你叫什么、你从哪里来、你为什么在这个地中海城市的地下酒吧里站在一个破木台上。' },
    { text: '你想了一件事。' },
    { text: '你没有想清楚那是什么——但你感觉到了。胸腔里有一团东西。一直在那里。你从来不碰它。你围着它走路、围着它吃饭、围着它学唱歌、围着它交朋友。' },
    { text: 'Nico弹了一个和弦——很重、很脏的和弦。你觉得那个和弦像一只手推了你一下。' },

function sceneNicoRockBar2d() {

    { text: '很难听。你知道。但你不在乎。' },

function sceneWalkAntique() {
  showNarrative([
    { text: '你拐进那条没有名字的巷子。藤蔓还是那么绿，石板路还是那么不平。门上那只闭着的眼睛好像每次来都画得不太一样——但你告诉自己是光线的关系。' },
    { text: '推门。Zeno在。天鹅绒外套。没封面的书。他抬头看了你一眼："一个人来的？"你说是。他点了点头："也好。东西有时候更愿意跟一个人说话。"' },
  ]);

  const available = ANTIQUE_ITEMS.filter(it => !S.antiqueItems.includes(it.id) && S.money >= it.price);
  if (available.length === 0) {
    showNarrative([
      { text: '你在店里转了一圈。Zeno说："今天没有你的东西。"你说："你怎么知道？"他说："因为你没停下来。"你想了想——确实，你没有在任何一个东西前面停下来。也许他是对的。' },
      { type: 'stat-up', text: '心情 +5' },
    ]);
    showChoices([{ text: '继续', action: sceneDailyMenu }]);
    return;
  }

  const items = [];
  const pool = [...available];
  const count = Math.min(3, pool.length);
  for (let i = 0; i < count; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    items.push(pool.splice(idx, 1)[0]);
  }

  showNarrative([{ text: '你在店里慢慢看了一圈。有几样东西让你停下了脚步。' }]);
  const choices = items.map(it => ({
    text: `${it.emoji} ${it.name}（${it.price}€）`,
    cost: it.desc,
    action: () => sceneAntiqueBuy(it),
  }));
  choices.push({ text: '今天不买了', action: () => {
    showNarrative([{ text: 'Zeno头也不抬："下次。"你出了门，回头看了一眼。门还在。你松了口气。' }]);
    showChoices([{ text: '继续', action: sceneDailyMenu }]);
  }});
  showChoices(choices);
}

function sceneSuChiMoon2() {

    { text: '蓝线火车上人不多。你坐在靠窗的位置，看着窗外的灯一盏一盏往后退。你的心跳比平时快——不是紧张，是一种你说不上来的预感。好像今天和别的日子不一样。好像有什么东西在等你。' },
    { text: '大学站。你走上石头台阶的时候看到了他——站在广场中央那棵老橘子树下面。他穿了那件洗得发白的亚麻衬衫，你认识这件衬衫。第一次约他逛旧城区他穿的就是这件。' },
    { text: '但今天不一样。' },
    { text: '广场上搬了一架钢琴——排练用的那台旧立式。旁边放了一把椅子和一个谱架。谱架上立着手写的乐谱——很多页。琴凳上坐着Yuki，她看到你的时候微微点了一下头，表情很温柔。' },
    { text: '你停住了。你说："这是……"' },
    { text: '苏迟走过来。他的手插在口袋里，你看到他的指节在布料下面攥着。他在紧张。苏迟在紧张。你从来没见过他这样——不是那种缩回壳里的安静，是一种把自己硬推出来的勇气。' },
    { text: '「我有东西给你，」他说。他的声音有一点抖。你想说什么但你的嗓子像被什么卡住了。' },
  ]);

  showChoices([{ text: '……听', action: sceneSuChiMoon3 }]);
}

function sceneSuChiMoon3() {
  showNarrative([
    { text: '他从口袋里拿出一张折了好几折的纸，递给你。你打开——' },
    { text: '手写的。他的字迹。最上面写着：' },
    { text: '「月亮从未落山」' },

    { text: '第一段写的是一个人走在陌生的城市里。街道上全是听不懂的语言，路灯照出影子但影子也是孤单的。他说他习惯了一个人，习惯了把所有的话写进笔记本而不是说出来。他说沉默是一种保护，也是一种自我流放。' },
    { text: '第二段，有一天他在广场上听到了一个声音——不是最好听的，不是最准的，但那个声音让他抬起了头。他说他不知道为什么。也许是因为那个声音里有一种不确定——和他自己一样的不确定。他在笔记本上画了一颗星。他不知道为什么要画星。' },
    { text: '第三段，他开始写他怎么发现自己在注意一些事情：那个人喝水的时候会两只手捧着杯子；那个人笑的时候眼睛会先眯起来；那个人听到好听的和声会微微张嘴；那个人跑调了会偷偷看他有没有听到——他每次都听到了，但他每次都假装没听到。' },
    { text: '你的眼睛开始模糊了。你抬头看苏迟——他没看你。他在看Yuki。Yuki在看谱子。' },

  showChoices([{ text: '（继续读）', action: sceneSuChiMoon4 }]);

function sceneSuChiMoon4() {
  showNarrative([
    { text: '苏迟开口了。' },

    { text: '你听过苏迟在排练里唱歌——稳、准、干净、克制。但你从来没有听过他这样唱。他的声音像一扇窗户被推开了——不是技巧，不是分析，不是乐评人苏迟，是一个人把胸腔里最柔软的东西拿出来放在你面前。' },
    { text: '歌词的第四段。他写了一个月亮。' },
    { text: '他说有一个晚上他在山上的那个小平台写东西，写不下去了。他抬头看月亮，月亮很圆。他想起小时候他妈唱给他听的那首歌——「月亮走，我也走」。他那时候不懂。现在他懂了。他说月亮不是在天上，月亮在一个人的眼睛里。他在某个人的眼睛里看到了月亮。从那天起月亮就再也没有落下来过。' },
    { text: '你读着手里的歌词纸。字在晃。你的手在抖。' },
    { text: '第五段。他写了他自己——一个从小被教导「沉默是金」的人。一个把感情全部写进曲子而不是说出来的人。一个别人问他「你喜欢什么」他会回答「巴赫赋格的对位结构」的人。他说他花了二十六年学会了怎么听音乐，但他花了更久才学会怎么听一个人说话。' },
    { text: '他说：「我不会说好听的话。我的情书是四声部合唱谱。我的告白是升A小调。我能给你的最好的东西就是一首歌。」' },
    { text: '他唱到这里的时候声音裂了一下。不是走音——是有什么东西从他的声音里漫出来了，溢出了技术能控制的范围。Yuki的手指在琴键上停了半拍，等他。他找回来了。但那个裂缝让你觉得心被什么东西捏了一下。' },

function sceneSuChiMoon5() {

    { text: 'Yuki安静地站起来，合上琴盖。她路过你身边的时候轻轻拍了一下你的手臂，什么也没说。她走了。你听到她的脚步声在石头台阶上渐渐远了。' },

// --- Composing questline ---
function sceneCompose() {
  adjustStat('energy', -10); adjustStat('mood', 5); advanceTime(); renderStatus();
  S.composingDay++;

  if (S.composingPhase === 1) {
    const p1 = [
      [{ text: '你把那天记下来的几个音翻出来看。嗯，你的简谱字迹像一种失传的古文字。你对着纸哼了一遍——旋律还在，没丢。你试着往后续了几个音。有的对，有的不对。你把不对的划掉。纸上多了很多划痕。' },
       { text: '你想：你到底想写一首什么样的歌？你闭上眼睛。脑子里冒出来的画面是——你到这座城市的第一天，拖着行李箱走在陌生的街上，不认识任何人。那种感觉。不是害怕，是一种安静的悬浮感。你还没落地。' }],
      [{ text: '你坐在阳台上，把手机录音打开，哼了几段旋律。听回放的时候你觉得——第一段还行，第二段像卡拉OK，第三段像闹钟铃声。你删了第二和第三段。' },
       { text: '你又哼了几遍第一段。它让你想到什么？你不知道。但你知道它让你觉得什么——像一个人站在车站等一班不知道几点到的车。不焦虑，但也没有确定感。你在纸上写了两个字：等待。' }],
    ];
    showNarrative([...pick(p1), { type: 'stat-up', text: '心情 +5' }]);
    if (S.composingDay >= 2) {
      S.composingPhase = 2; S.composingDay = 0;
      showNarrative([{ type: 'system', text: '你决定给这首歌写歌词。' }]);
    }
    showChoices([{ text: '继续', action: sceneDailyMenu }]);
    return;
  }

  if (S.composingPhase === 2) {
    const p2 = [
      [{ text: '你试着写歌词。第一行写了删删了写写了又删。你总觉得每一句都太假了——太像「歌词」了。你想要的不是那种东西。你想要的是说话的感觉。但说话谁会唱呢？' },
       { text: '你想起Dietrich说过的一句话：「合唱不是表演，是对话。」也许歌词也是这样。不是写给别人听的，是你跟自己的对话。你重新拿起笔。这次你没有想「怎么写」，你只是想「你到底想说什么」。' }],
      [{ text: '你写了半页歌词。关于到一个陌生城市的感觉——不认识路，不会说当地语言，走进一家咖啡馆不知道怎么点单，但窗外的阳光是好的，街上的声音是好的，有人在远处唱歌。' },
       { text: '你念了一遍。有些地方太啰嗦了。你画了几个叉。歌词不能像散文一样长——它要短，要有节奏，要让人想跟着唱。你重新改了一遍。好了一点。但还差得远。你把纸折起来放进抽屉。明天再看。' }],
      [{ text: '你把昨天写的歌词拿出来看。过了一夜，有些句子你觉得还不错，有些你想掐死昨天的自己。你在空白处又写了一个段落——关于第一次走进排练室听到所有人一起唱的感觉。那个瞬间你的鸡皮疙瘩起来了。你想把那个鸡皮疙瘩写进歌词里。' }],

    { text: '大脑一片空白。你的嘴张着，但没有声音出来。你慌了。你的手心全是汗。你看了一眼谱架——谱子上的字像蚂蚁一样在爬。你听到旁边苏迟的声音稳稳地在唱。' },
    { text: '——不要停。' },
    { text: 'Dietrich的话在你脑子里响了。不要停。你停了，旁边的人会接住你。' },
    { text: '你闭上眼睛。不看谱子。不想歌词。你只是听——听苏迟的声音，听Sofia的声音，听Ibrahim的声音。你让他们的声音把你包起来。然后你的嘴跟着动了。歌词从某个你不知道的地方回来了——不是脑子记得，是身体记得。是几十个傍晚反复唱了几十遍的肌肉记忆。' },
    { text: '你接住了。' },
    { text: '你的声音重新加入了河流。没有人发现你消失过。也许他们发现了——但没有人停下来。这就是合唱。你掉了，他们接住了你。你回来了，像从来没有离开过一样。' },
  ]);
  showChoices([{ text: '最后一首', action: scenePerformance3 }]);
}

function scenePerformance3() {
  showNarrative([
    { text: '第三首：The Singularity。你们自己选的当代曲目。' },
    { text: '这首歌不像前两首那样古老和沉重。它是关于奇点的——关于所有孤立的声音汇聚成一个点的那个瞬间。关于宇宙大爆炸之前那个无限密集的时刻。关于所有分散的、孤独的、漂泊的东西终于聚在一起的那一刹那。' },
    { text: '这是你们的歌。你在心里这样想。你们这些从不同国家、不同语言、不同人生里来到同一个地中海小城的人。你们在一个橘子树下面的旧仓库里一起唱了几十个傍晚。现在你们站在巴塞罗那的教堂里，唱一首关于所有孤独的东西怎样变成一的歌。' },
    { text: '你唱了。你把所有的东西都放进去了——第一天的紧张，打工的疲惫，给家里打电话时的心酸，海边散步的安静，Dietrich不加糖的咖啡，Nico半夜的吉他，苏迟在旧书摊前的笑容，所有那些你以为微不足道但其实塑造了你的瞬间。' },
    { text: '你感觉到了。就在某一个小节——所有人的声音完美地融在一起的那一瞬间。时间停了。不是夸张——是真的停了。声音不再是声音了。它变成了一种物质，一种温度，一种你可以触摸到的东西。教堂的穹顶消失了。墙壁消失了。只剩下声音，和这些人，和你们一起构成的这个不可重复的瞬间。' },
    { text: '奇点。' },
    { text: '你的眼泪掉下来了。你没有擦。你继续唱。你旁边的苏迟也在哭。Sofia也在哭。你不知道观众有没有发现——你不在乎。这首歌不是唱给他们的。这首歌是唱给你们自己的。是唱给每一个选择留下来的傍晚、每一次在雨里跑向排练室的奔跑、每一次觉得自己不属于这里但还是来了的勇气。' },
    { text: '最后一个音。Dietrich的手停在空中。五秒。十秒。' },
    { text: '然后他的手放下了。' },
  ]);
  showChoices([{ text: '…', action: scenePerformance4 }]);
}

function scenePerformance4() {
  showNarrative([
    { text: '安静。' },
    { text: '一秒。两秒。三秒。' },
    { text: '你以为出了什么问题。为什么没人鼓掌？你紧张地看了一眼Dietrich——他站在指挥台上，一动不动，低着头。然后你看到他的肩膀在抖。他在哭。Dietrich——那个永远镇定、永远精确、永远不加糖的Dietrich——在哭。' },
    { text: '然后掌声来了。' },
    { text: '像潮水。像一面墙倒下来。你终于看到了观众——他们站起来了。所有人都站起来了。你看到第一排的一个女人在用手帕擦眼睛。你看到后排有人举着手机在录。你看到评委席上的一个老人——头发全白了——在鼓掌，在笑，在摇头，像是在说「这怎么可能」。' },
    { text: '你不知道该做什么。你站在舞台上，灯光照着你，眼泪还挂在脸上，耳朵里全是掌声和你自己的心跳。你转头看苏迟——他看着你，眼圈红红的，嘴角上翘。他什么都没说。不用说。他伸出小指，碰了碰你的小指。' },
    { text: 'Ibrahim走回到队伍里，Marta一把抱住了他。Nico在笑，那种很大声的笑，像是所有压力一下子都释放了。Aoife在蹦。Sofia在鼓掌——给你们自己鼓掌。Carlos在偷偷比一个V。Yuki从口袋里掏出一面很小的旗——上面写着"合唱团万岁"，你不知道他什么时候做的。Lena安安静静地笑着，眼睛亮得像星星。' },
    { text: 'Dietrich转过身面对你们。他的眼睛还是红的。他没有说话。他只是深深地鞠了一躬。' },
    { text: '你在这一刻想：我来到这座城市的时候，我以为我是一个人。我错了。' },
    { type: 'system', text: '你们完成了Europa Cantat的演出。' },
    { type: 'stat-up', text: '心情大幅提升 · 声乐技巧 +5' },
  ]);
  adjustStat('mood', 25); adjustStat('vocal', 5); adjustStat('social', 10);
  showChoices([{ text: '等待结果', action: sceneVictory }]);
}

function sceneVictory() {
  S.choirDrama.victory = true;
  showNarrative([
    { text: '等待的几个小时是最难熬的。' },
    { text: '你们坐在教堂外面的台阶上。九月的巴塞罗那傍晚很美——天空是粉紫色的，有海鸥在飞。但你什么都看不进去。你在数台阶上的裂缝。' },
    { text: 'Nico去买了一大袋橘子回来。"不管结果怎样，"她说，"我们吃橘子。"你剥了一个橘子。很甜。你想这座城市到处都是橘子。' },
    { text: 'Carlos和Marta坐在一起，Marta的头靠在Carlos的肩上。Ibrahim坐在最高一级台阶上，面朝着最后一点夕阳的方向。Aoife在给家里打电话，用爱尔兰语说着什么，大概是在说我们唱得很好。苏迟在看一本从书摊上买的旧书——你看不清书名。Dietrich站在一棵树下抽他这辈子第一根烟——Nico给的。他咳了三声，但没有把烟扔掉。' },
    { text: '你的手机响了。你妈发了一条微信："怎么样了？"你回复："还在等。"她说："不管结果怎样妈妈都为你骄傲。"你没有回复这条。你把手机翻过去扣在台阶上。你的鼻子酸了。' },
    { text: '然后Yuki跑过来了。他从教堂里面跑出来，手里举着手机，鞋子跑掉了一只——' },
    { text: '「出来了！！！」' },
    { text: '所有人都站了起来。你的橘子滚到了台阶下面。' },
    { text: 'Yuki把手机举给Dietrich看。Dietrich看了三秒。他的脸没有变。然后他闭上眼睛，深深地吸了一口气，然后呼出来。然后他睁开眼睛说了一句话：' },
    { text: '「银奖。」' },
  ]);
  showChoices([{ text: '…银奖？', action: sceneVictory2 }]);
}

function sceneVictory2() {
  showNarrative([
    { text: '银奖。不是金奖。' },
    { text: '有一瞬间你不知道自己该什么表情。银奖。你们这么努力——那些傍晚，那些反复，那些争吵和和解和雨和橘子——结果是银奖？' },
    { text: '你看了一眼其他人。Nico的嘴张开了，但没发出声音。Sofia愣了一秒。Ibrahim低下了头。' },
    { text: '然后Dietrich笑了。你从来没有见过他这样笑——不是微笑，不是礼貌的笑，是那种把所有皱纹都笑出来的笑。他说：' },
    { text: '「你们知道有多少合唱团参加了这次比赛吗？」' },
    { text: '一百四十七个。来自三十二个国家。你们——一个地中海小城的社区合唱团，成立不到一年，成员来自九个不同的国家，一半人一年前还不会看五线谱——银奖。' },
    { text: 'Nico是第一个反应过来的。她尖叫了一声——那种在摇滚酒吧里才会发出的声音——然后跳到了Carlos的背上。Carlos差点摔倒，但Marta从后面接住了他们两个。然后是连锁反应——Sofia抱住了Lena，Lena抱住了Yuki，Yuki抱住了Aoife，Ibrahim站在原地被所有人抱了一轮。' },
    { text: '苏迟走到你身边。他什么都没说。他把那本旧书合上，塞进口袋，然后——你没想到——他抱了你。苏迟从来不主动碰人的。他的拥抱很轻、很快、很笨拙，像一个不太会拥抱的人在努力拥抱。但你感觉到了。你也抱了回去。' },
    { text: '然后你去抱了Dietrich。Dietrich僵了一秒——然后他拍了拍你的背。他说："你唱得很好。"你说："你也是。"他说："我又不唱。"你说："你知道我什么意思。"' },
    { text: '他知道你什么意思。' },
    { text: '有人打翻了橘子。地上滚了一地橘子。没有人在乎。' },
  ]);
  showChoices([{ text: '庆祝', action: sceneVictory3 }]);
}

function sceneVictory3() {
  showNarrative([
    { text: '那天晚上你们在巴塞罗那的小巷子里庆祝。找了一家很小的酒馆——Tapas、Sangria、音乐。Carlos用叉子敲杯子发表了一段即兴演讲，大意是"你们都是最好的疯子"。Marta补充说"我做的丝带好看吧？我就说银的比金的好看"。' },
    { text: 'Nico带了吉他。她唱了那首Fire, Burning Fire。在一个巴塞罗那的地下酒馆里。所有人跟着唱。你也唱了。你的声音沙哑了——唱了太多——但你不在乎。Nico对你眨了眨眼。你们的秘密。你们的火。' },
    { text: 'Ibrahim教了大家一首约旦民歌。谁都不会唱。发音全错了。但大家都在唱。Ibrahim笑得整张脸都亮了——你想你从来没有见过他这么开心。' },
    { text: 'Sofia拉着你去外面的露台上坐了一会儿。巴塞罗那的夜景很美。你能看到远处的圣家堂还在亮着灯。你们不说话，只是看着。然后Sofia说："你知道吗？我来欧洲的时候什么都没有。你也是吧？"你说："嗯。"她说："现在我们有银奖了。"她笑了。你也笑了。笑着笑着眼眶就湿了。' },
    { text: '午夜的时候你出来接了一个电话。你妈。她哭了。她在电话那头说："我闺女/我儿子好厉害。"你说："妈，是银奖。"她说："我不管什么奖。我的孩子在那么远的地方能这么快乐，这比什么奖都重要。"' },
    { text: '你在巴塞罗那的街上，凌晨一点，听你妈在电话里哭了五分钟。你也哭了。但是那种好的哭。那种你终于可以告诉妈妈「我在这里很好」的哭。' },
    { text: '回到酒馆的时候，Yuki和Lena在教Dietrich跳一种看不懂的舞。Dietrich跳得很僵硬，但他在笑。Aoife在录像。这段视频后来在合唱团的群里被转发了一百多次。' },
  ]);
  showChoices([{ text: '回家', action: sceneEpilogue }]);
}

function sceneEpilogue() {
  S.choirDrama.epilogue = true;
  showNarrative([
    { text: '火车从巴塞罗那开回了你们的小城。四个小时。' },
    { text: '你靠在窗边看风景。地中海沿岸。海是蓝的——那种你在国内从来没有见过的蓝。山是绿的。偶尔经过一个小镇，红屋顶，白墙，晾在外面的衣服。你想：一年前你第一次坐这条线路来到这里。那时候你觉得什么都陌生。现在你在回家。' },
    { text: '对面的Nico睡着了，头歪在Sofia的肩上。Sofia也睡着了。Carlos和Marta在打牌。Yuki在看窗外，耳机里在放不知道什么歌。Aoife在写日记。Ibrahim在祈祷——或者只是闭着眼睛。Lena在织一条围巾——她说是给Dietrich的圣诞礼物，但现在才九月，她说"我织得慢"。' },
    { text: '苏迟坐在你旁边。他在看那本旧书——你终于看到了书名，是一本加缪的《局外人》法语版。他看得很慢，大概每页要翻好几次字典。你没有打扰他。' },
    { text: 'Dietrich坐在最前面。他在看谱子——已经在选下一季的曲目了。银奖领回来还没到两天，他已经在想下一次了。你想：这就是Dietrich。永远在准备下一首歌。' },
    { text: '火车经过一片橘子园的时候你想起了一件事。你来的那天——你拖着行李箱走在一条你不认识的路上，天气太热，你又渴又累又害怕，你在想"我为什么要来这里"。然后你看到路边有一棵橘子树。树上结满了橘子。你从来没有见过橘子长在树上的样子——在国内橘子是超市里一袋一袋的。你在那棵树下面站了很久。你想：一个橘子长在树上的地方，也许不会太糟。' },
    { text: '现在你知道了。' },
    { text: '不只是不太糟。' },
    { text: '你在这里有了一个合唱团。有了会在你忘词的时候接住你的人。有了一起在雨里跑向排练室的人。有了在台阶上一起等结果一起吃橘子的人。有了让你在凌晨一点打电话给妈妈说「我很好」的人。' },
    { text: '你来的时候是一个人。你不再是一个人了。' },
  ]);
  showChoices([{ text: '继续', action: sceneEpilogue2 }]);
}

function sceneEpilogue2() {
  showNarrative([
    { text: '火车到站了。你们走出车站。夕阳打在小城的墙壁上，所有的墙都是金色的。你深吸一口气——盐、橘子、旧石头。你闻到了家的味道。' },
    { text: '广场上居然有人在等你们。Carlos的女儿举着一幅用蜡笔画的画——上面画了一个银色的奖杯和一行歪歪扭扭的字：「我爸爸的合唱团最棒！」Carlos蹲下来抱住了她，转了三圈。Marta站在一边笑着录像。' },
    { text: '你的房东太太也来了。她拿了一盘自己做的饼干。她说"你要不要教我唱那首鸟的歌"——她说的是El Cant dels Ocells。你说"好啊"。你想：我来的时候你冲我笑，我不知道你在笑什么。现在我知道了。你在笑一个即将属于这里的人。' },
    { text: '你们在广场上合了一张影。十几个人，加上Carlos的女儿，加上Dietrich（被Nico拉进来的），加上一个路过好奇围观的老大爷。Tomás自告奋勇当摄影师。他蹲在地上，用一个奇怪的角度拍了一张逆光的照片。照片里所有人都在笑，所有人的轮廓都被金色的阳光勾了一圈边。他说"就是这个光"。后来他把这张照片洗出来，挂在了Carlos的咖啡店里。' },
    { text: '然后大家各自散了。该回家了。明天又是新的一天——工作、生活、柴米油盐。但是每个星期二和星期四的傍晚，你知道你会出现在那个旧仓库里。会有橘子树的味道。会有Dietrich的节拍器。会有所有这些人。' },
    { text: '你一个人走在回公寓的路上。石头路。路灯刚刚亮。远处的海是深蓝色的。你突然想唱歌。不是什么正式的歌——就是哼，随便哼。你哼了几个小节。你的声音在空空的街道上回荡了一下。' },
    { text: '你笑了。' },
    { text: '你想起你出发的那天在机场。你一个人坐在登机口，行李箱贴着腿，看着窗外的飞机，想着一句话：「我能做到吗？」' },
    { text: '现在你知道答案了。' },
    { text: '不是"能"——' },
    { text: '——是"已经做到了"。' },
    { type: 'system', text: '你的地中海合唱团故事到这里就结束了。谢谢你的歌声。' },
    { type: 'stat-up', text: '完结 · 银奖 · 感谢每一个选择留下来的傍晚' },
  ]);
  adjustStat('mood', 30);
  showChoices([
    { text: '🎵 从头开始', action: () => { location.reload(); } },
    { text: '留在这里', action: () => { showNarrative([{ text: '你坐在窗台上，看着小城的夜景。海风带来远处某个酒馆的音乐声。你很好。你在这里很好。' }]); showChoices([]); } },
  ]);
}

// --- Painting with Tomás ---
function scenePaintingLesson() {
  if (!S.npcs.tomas) { sceneDailyMenu(); return; }
  S.paintingLessons++; S.artSkill += 3;
  adjustStat('energy', -10); adjustStat('mood', 8); advanceTime();
  S.npcs.tomas.talked++; S.npcs.tomas.affinity += 5;
  renderStatus();
  const lessons = [
    [{ text: '你在Carlos的店里找到了Tomás，问他能不能教你画画。他想了想说："我可以试试。但我不是老师。"' },
     { text: '他带你去了海边的防波堤。给了你一个小速写本和一支铅笔。"画你看到的，"他说，"不要想好不好看。"' },
     { text: '你画了远处的灯塔。画得很歪。Tomás看了一眼说："你的线条很有力量。不是所有人都敢这么用力地画。"' },
     { text: '他在你旁边也画了一幅灯塔。用的是同一个角度，但他的灯塔像是活的——光从塔尖流下来。' },
     { text: '「画画和唱歌一样，」他说，「不是画得像，是画出感觉来。你有感觉。」' },
     { type: 'stat-up', text: '心情 +8 · 绘画技巧 +3 · Tomás好感度提升' }],
    [{ text: '第二次画画课。Tomás带了水彩颜料。你们坐在广场的橘子树下，画面前的旧喷泉。' },
     { text: '水彩比你想象的难控制——颜色到处流。Tomás说"就让它流。水彩的美就在于你没法完全控制它。"' },
     { text: '你画出来的喷泉像是融化了。但颜色意外地好看——蓝色和土黄色混在一起，变成了一种你没见过的颜色。' },
     { text: '「这个颜色，」Tomás指着你的画说，「这是这座城市傍晚的颜色。你自己都不知道你观察得这么准。」' },
     { text: '回去的路上你把画给Sofia看了。她说"好看！"然后仔细看了一会儿说"这是那个喷泉对不对？我能认出来"。你很开心。' },
     { type: 'stat-up', text: '心情 +8 · 绘画技巧 +3 · Tomás好感度提升' }],
    [{ text: 'Tomás今天让你画人。你们在咖啡馆里，他让你画对面桌的一个正在看书的老人。' },
     { text: '你画了十五分钟。画完发现老人的比例全错了——头太大，手太小，椅子是歪的。但Tomás说"你注意到了他翘起来的那根手指，这是一个画家的观察力"。' },
     { text: '他给你看他画的同一个人——几根线条，但你能看出那个老人在想什么。这种差距让你有点沮丧。' },
     { text: '「我画了二十年了，」Tomás说，「你才画了三次。你唱歌是一天学会的吗？」' },
     { text: '你说不是。他笑了："那就是了。给自己时间。"' },
     { type: 'stat-up', text: '心情 +8 · 绘画技巧 +3 · Tomás好感度提升' }],
    [{ text: 'Tomás今天没有教你画什么新东西。他说"今天我们去看画"。' },
     { text: '你们去了大学旁边的一个很小的美术馆。免费的。里面只有两个展厅，正在展出本地画家的作品。' },
     { text: '他在每幅画前面停很久，用很慢的语速讲画家在做什么——"你看这里的光是冷的，但影子是暖的。这说明他画的不是眼睛看到的光，是心里的光。"' },
     { text: '你看着画，试着用他教你的方式去看。你发现你现在能看到以前看不到的东西——颜色之间的对话，线条的情绪，留白的意义。' },
     { text: '出来以后你说"我觉得我看世界的方式变了一点"。Tomás说"那我今天的课就上完了"。' },
     { type: 'stat-up', text: '心情 +8 · 绘画技巧 +3 · Tomás好感度提升' }],
  ];
  if (S.paintingLessons <= lessons.length) {
    showNarrative(lessons[S.paintingLessons - 1]);
  } else {
    const freePaint = [
      [{ text: '你和Tomás在海边画画。今天画的是渔船。你画得还是不太像，但他说"你的颜色感觉比上次好了"。你觉得这就够了。' },
       { type: 'stat-up', text: '心情 +8 · 绘画技巧 +3 · Tomás好感度提升' }],
      [{ text: '你在Carlos的店里画速写。Tomás在旁边画他的。你们没怎么说话。但有时候不说话比说话更舒服。' },
       { type: 'stat-up', text: '心情 +8 · 绘画技巧 +3 · Tomás好感度提升' }],
      [{ text: '今天Tomás让你画他。你画了半个小时。画出来的他比真人好看一点。他看了说"你美化了我"。你说"也许我看到的就是这样"。他没回话但你看到他耳朵红了。' },
       { type: 'stat-up', text: '心情 +8 · 绘画技巧 +3 · Tomás好感度提升' }],
      [{ text: '你们去了旧城区画建筑。阳光很好。Tomás教你怎么画阴影——"阴影不是黑色的，它有颜色。看，那个墙的影子是紫色的。"你以前从来没注意过影子有颜色。' },
       { type: 'stat-up', text: '心情 +8 · 绘画技巧 +3 · Tomás好感度提升' }],
    ];
    showNarrative(pick(freePaint));
  }
  showChoices([{ text: '继续', action: sceneDailyMenu }]);
}

// --- Find job ---
function sceneFindJob() {
  adjustStat('energy', -15); adjustStat('social', 2); advanceTime();
  if (S.hasJob) {
    showNarrative([{ text: '你已经有工作了。' }]);
    showChoices([{ text: '继续', action: sceneDailyMenu }]); return;
  }
  const roll = Math.random();
  const paras = [];
  if (roll < 0.45 && S.day > 3) {
    const jobs = [
      { type: '海边咖啡馆帮工', pay: 55 },
      { type: '杂货店收银', pay: 50 },
      { type: 'Carlos的餐厅帮厨', pay: 48 },
    ];
    const job = S.npcs.carlos.talked > 0 && Math.random() < 0.4 ? jobs[2] : pick(jobs);
    S.hasJob = true; S.jobType = job.type; S.jobPay = job.pay;
    paras.push({ text: job.type === 'Carlos的餐厅帮厨'
      ? 'Carlos发消息问你要不要来他店里帮忙，"不多，一周三四天，包一顿饭"。你秒回了"好"。你心想：终于不用再吃泡面了。虽然你本来也不怎么吃泡面——但那种心态是一样的。'
      : `你在海边看到一家${job.type.replace('帮工','').replace('收银','')}贴着招人启事。进去问了一下，你用磕磕绊绊的英语加上手势解释了一通。对方看你看了几秒说"明天能来吗？"你说"能！"出来以后你在街上攥了一下拳头。` });
    paras.push({ type: 'stat-up', text: `找到工作：${job.type}（日薪约${job.pay}€）` });
    adjustStat('mood', 10);
  } else if (roll < 0.75) {
    paras.push({ text: '你投了几份简历，跑了两家店。一家说不需要，一家让你下周再来。你说"好的谢谢"，走出来的时候忍住了叹气。不过你注意到第二家老板看你的时候在笑——也许真的下周可以。' });
    paras.push({ type: 'stat-down', text: '什么也没找到。但至少混了个脸熟。' });
    adjustStat('mood', -3);
  } else {
    paras.push({ text: '你去了职业中心排了一个小时的队。轮到你的时候那个窗口的工作人员看了你的证件，摇了摇头——还需要一份翻译件。你说"哪里能做翻译？"他说了一个地址。你说"谢谢"的语气平静得连你自己都佩服。' });
    paras.push({ text: '出来的时候阳光很好，你却很想骂人。你在台阶上站了一会儿，深呼吸。你告诉自己：这都是过程。但你的心情确实很差。' });
    paras.push({ type: 'stat-down', text: '心情 -8' });
    adjustStat('mood', -8);
  }
  renderStatus(); showNarrative(paras);
  showChoices([{ text: '继续', action: sceneDailyMenu }]);
}

// --- Work ---
function sceneWork() {
  adjustStat('energy', -20); adjustStat('money', S.jobPay||50); advanceTime(); renderStatus();
  const texts = [
    `${S.jobType}的一天。忙但不复杂。阳光从窗户照进来的角度你已经能用来判断几点了——下午三点，阳光照在柜台上那个缺了口的花瓶上。你觉得自己正在变成这个地方的一部分。`,
    `今天有个客人跟你聊了很久。你的本地语在进步，至少点菜不用比划了。客人走的时候说了句"你的口音很可爱"。你不知道该不该高兴——但你还是笑了。`,
    `忙了一整天。腿酸得不行。收工的时候同事递给你一杯espresso。"你看起来需要这个。"你说"太需要了"。喝完感觉灵魂回到了身体里。`,
    `今天的客人里有一个带着小孩的妈妈。小孩用本地语叫你"姐姐"。你说了句"你好呀"。小孩被你的中文吓了一跳然后笑了。你的心化了一点。`,
  ];
  showNarrative([{ text: pick(texts) }, { type: 'stat-up', text: `+${S.jobPay||50}€` }]);
  showChoices([{ text: '继续', action: sceneDailyMenu }]);
}

// ========== SAVE / LOAD ==========
const SAVE_KEY = 'chorus-now-save-';

function getSaveSlots() {
  const slots = [];
  for (let i = 0; i < 3; i++) {
    try {
      const raw = localStorage.getItem(SAVE_KEY + i);
      slots.push(raw ? JSON.parse(raw) : null);
    } catch(e) { slots.push(null); }
  }
  return slots;
}

function slotSummary(data) {
  if (!data) return null;
  const dow = ['周一','周二','周三','周四','周五','周六','周日'];
  const weekNum = Math.ceil(data.state.day / 7);
  const d = dow[(data.state.day - 1) % 7];
  const time = ['早上','下午','傍晚','深夜'][data.state.timeSlot];
  const choir = data.state.choirJoined ? '已入团' : '未入团';
  const date = new Date(data.savedAt);
  const dateStr = date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  return { week: weekNum, dow: d, time, choir, dateStr, money: data.state.money };
}

function renderSlots(mode) {
  const slots = getSaveSlots();
  let html = `<div class="save-overlay" id="save-overlay" onclick="if(event.target===this)closeSavePanel()">
    <div class="save-panel">
    <h2>${mode === 'save' ? '💾 存档' : '📂 读档'}</h2>`;
  for (let i = 0; i < 3; i++) {
    const s = slots[i];
    const info = slotSummary(s);
    if (info) {
      html += `<div class="save-slot" onclick="${mode}Slot(${i})">
        <div class="slot-title">存档 ${i+1}</div>
        <div class="slot-info">第${info.week}周 · ${info.dow} · ${info.time} | ${info.choir} | ${info.money}€</div>
        <div class="slot-info">${info.dateStr}</div>
      </div>`;
    } else {
      html += `<div class="save-slot ${mode==='load'?'empty':''}" ${mode==='save'?`onclick="saveSlot(${i})"`:''}>
        <div class="slot-title">存档 ${i+1}</div>
        <div class="slot-info">${mode==='save'?'空槽位，点击保存':'空</div>'}</div>
      </div>`;
    }
  }
  html += `<div class="save-actions">
    <button onclick="closeSavePanel()">关闭</button>
    ${mode === 'save' ? '' : ''}
  </div></div></div>`;
  return html;
}

function openSavePanel() {
  document.getElementById('save-overlay')?.remove();
  document.body.insertAdjacentHTML('beforeend', renderSlots('save'));
}

function openLoadPanel() {
  document.getElementById('save-overlay')?.remove();
  document.body.insertAdjacentHTML('beforeend', renderSlots('load'));
}

function closeSavePanel() {
  document.getElementById('save-overlay')?.remove();
}

function saveSlot(i) {
  try {
    const data = { state: JSON.parse(JSON.stringify(S)), savedAt: new Date().toISOString() };
    localStorage.setItem(SAVE_KEY + i, JSON.stringify(data));
    closeSavePanel();
    showNarrative([{ type: 'system', text: `已保存到存档 ${i+1}。` }]);
    setTimeout(() => sceneDailyMenu(), 800);
  } catch(e) {
    alert('存档失败：' + e.message);
  }
}

function loadSlot(i) {
  try {
    const raw = localStorage.getItem(SAVE_KEY + i);
    if (!raw) return;
    const data = JSON.parse(raw);
    Object.keys(data.state).forEach(k => { S[k] = data.state[k]; });
    closeSavePanel();
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    sceneDailyMenu();
  } catch(e) {
    alert('读档失败：' + e.message);
  }
}
</script>
